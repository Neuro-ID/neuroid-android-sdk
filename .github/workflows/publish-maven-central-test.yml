# ******************************************************************
# Standalone, manually-triggered workflow to test publishing the
# NeuroID SDK to Maven Central WITHOUT creating a GitHub release.
# Intentionally kept separate from release.yml.
# ******************************************************************

name: Publish to Maven Central (Test)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to check out and publish from'
        required: true
        default: 'main'

jobs:
  publish:
    name: Publish SDK to Maven Central
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Permission for Gradlew
        run: chmod +x gradlew

      # gradle.properties normally holds only commented placeholders for these
      # values (real secrets are never committed). Append the actual secrets
      # here so they exist only in the ephemeral runner workspace.
      - name: Write Maven Central secrets to gradle.properties
        run: |
          SIGNING_KEY_ESCAPED=$(printf '%s' "${{ secrets.SIGNING_RELEASE_KEY_TEST }}" | awk 'BEGIN{ORS="\\n"} {print}')
          {
            echo "sonatypeUsername=${{ secrets.SONATYPE_USERNAME_TEST }}"
            echo "sonatypePassword=${{ secrets.SONATYPE_USERNAME_PASSWORD_TEST }}"
            echo "signingInMemoryKey=${SIGNING_KEY_ESCAPED}"
            echo "signingInMemoryKeyPassword=${{ secrets.SIGNING_RELEASE_KEY_PASSWORD_TEST }}"
          } >> gradle.properties

      - name: Publish to Maven Central 🚀
        run: ./gradlew publishToMavenCentral

