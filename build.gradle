import org.jetbrains.kotlin.gradle.dsl.JvmTarget

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = "2.3.20"

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.10.2"
        classpath "org.jacoco:org.jacoco.core:0.8.15"
        classpath "org.jlleitschuh.gradle:ktlint-gradle:14.2.0"
    }
}

ext {
    javaVersionCompat = JavaVersion.VERSION_11
    jdkVersion = 17
    kotlinJvmTarget = JvmTarget.JVM_11
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}