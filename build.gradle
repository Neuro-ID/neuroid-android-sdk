// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    ext.kotlin_version = "1.9.24"
    dependencies {
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.48'
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.0"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:2.8.2"
        classpath('com.google.dagger:hilt-android-gradle-plugin:2.48')
        classpath "org.jacoco:org.jacoco.core:0.8.12"
        classpath "org.jlleitschuh.gradle:ktlint-gradle:12.1.1"
    }
}

plugins {
    // Manages creating/closing/releasing the staging repository on Maven Central's
    // Central Publisher Portal. Secrets (sonatypeUsername/sonatypePassword) are
    // supplied later via gradle.properties or SONATYPE_USERNAME/SONATYPE_PASSWORD env vars.
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
            username.set(providers.gradleProperty("sonatypeUsername").orElse(providers.environmentVariable("SONATYPE_USERNAME")))
            password.set(providers.gradleProperty("sonatypePassword").orElse(providers.environmentVariable("SONATYPE_PASSWORD")))
            // The plugin looks up the Sonatype staging profile by "packageGroup", which
            // defaults to rootProject.group -- but the root project never sets a group
            // (only :NeuroID does), so it defaults to "" and the lookup fails with
            // "Failed to find staging profile for package group: ". Read it lazily from
            // :NeuroID so it always matches the actual published artifacts' groupId.
            packageGroup.set(providers.provider { project(":NeuroID").group.toString() })
        }
    }
}

// closeAndReleaseStagingRepositories (via the classic OSSRH-compatible staging API) already
// fully closes AND releases the staging repository, which promotes it straight through to
// Maven Central and publishes it -- confirmed live on repo1.maven.org after a real run.
// There is no separate "manual publish" step needed for this flow, so a prior attempt at
// calling Sonatype's manual-upload "publishing_type=automatic" endpoint afterward always
// failed with "No repository found ...--default-repository", since the repository was
// already gone (fully promoted) by the time that call ran. That extra call has been removed.
//
// NOTE: closeAndReleaseStagingRepositories is a ROOT project task (registered by the
// nexus-publish-plugin at the root only). Invoke it without a module path, e.g.:
//   ./gradlew publishToMavenCentral
// NOT ./gradlew :NeuroID:closeAndReleaseStagingRepositories (that task doesn't exist).
//
// The nexus-publish-plugin only *orders* closeAndReleaseStagingRepositories to run after
// publishToSonatype when both are in the same task graph -- it does not add a hard
// dependency. So publishToSonatype must be included here too, otherwise no staging
// repository exists yet and closeSonatypeStagingRepository fails with
// "No staging repository with name sonatype created". publishToSonatype itself is only
// registered per-subproject (Gradle's CLI task-name matching resolves it across
// subprojects when typed on the command line, but dependsOn requires an exact task path).
tasks.register("publishToMavenCentral") {
    group = "publishing"
    description = "Publishes, closes, and releases the Maven Central staging deployment."
    dependsOn ":NeuroID:publishToSonatype", "closeAndReleaseStagingRepositories"
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
