plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'maven-publish'
    id 'jacoco'
    id 'org.sonarqube' version '7.5.0.8588'
    id 'org.jlleitschuh.gradle.ktlint'
}

ktlint {
    version.set("1.3.1")
    android.set(true)
    ignoreFailures.set(false)
    outputToConsole.set(true)
    filter {
        exclude { it.file.path.contains("${buildDir}${File.separator}") }
    }
}
def versionPropsFile = rootProject.file("version.properties")
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
}

sonar {
    properties {
        property("sonar.projectKey", "Neuro-ID_neuroid-android-sdk")
        property("sonar.host.url", "https://sonarcloud.io")
    }
}

def getGitHash = { ->
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
        standardOutput = stdout
    }
    return stdout.toString().trim()
}
def nameSpace = "com.neuroid"

def androidSDKVariant = "android-sdk"
def debugVariant = "-debug"
def reactNativeVariant = "react"

ext {
    versionName = "\"${versionProps['VERSION_MAJOR']}.${versionProps['VERSION_MINOR']}.${versionProps['VERSION_PATCH']}\""
}
group = nameSpace
version = versionName

android {
    namespace = "com.neuroid.tracker"
    compileSdkVersion = 36

    defaultConfig {
        minSdk 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        versionName = "\"${versionProps['VERSION_MAJOR']}.${versionProps['VERSION_MINOR']}.${versionProps['VERSION_PATCH']}\""
    }

    buildTypes {
        debug {
            minifyEnabled false
            jniDebuggable true
            buildConfigField "String", "VERSION_NAME", "${defaultConfig.versionName}"
            buildConfigField "String", "GIT_HASH", "\"${getGitHash()}\""
            enableUnitTestCoverage = true    // For unit tests
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "VERSION_NAME", "${defaultConfig.versionName}"
            buildConfigField "String", "GIT_HASH", "\"${getGitHash()}\""
        }
    }

    flavorDimensions = ["native", "adv"]

    productFlavors {
        android {
            dimension "native"
        }
        reactNative {
            dimension "native"
        }
        lib {
            dimension "adv"
        }
    }

    libraryVariants.configureEach { variant ->
        variant.outputs.all {
            def versionName = defaultConfig.versionName.replace('\"', '')
            outputFileName = "${variant.getFlavorName()}/neuro-id-android-sdk-${variant.getFlavorName()}-$versionName-${variant.buildType.name}.aar"
        }
    }
    compileOptions {
        sourceCompatibility rootProject.ext.javaVersionCompat
        targetCompatibility rootProject.ext.javaVersionCompat
    }

    buildFeatures {
        compose true
        buildConfig true
    }


    testOptions {
        unitTests.returnDefaultValues = true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

    // Registers each build-variant/flavor combination as a publishable software component.
    // Required by AGP so that `components.<variantName>` (consumed below in the `publishing`
    // block) resolves without the "Android Publication ... Misconfigured" warning.
    publishing {
        singleVariant("androidLibDebug") {}
        singleVariant("androidLibRelease") {}
        singleVariant("reactNativeLibDebug") {}
        singleVariant("reactNativeLibRelease") {}
    }
}

// Required because this module applies kotlin-kapt: without an explicit jvmTarget,
// AGP auto-inference of Kotlin's jvmTarget from compileOptions does not reliably
// propagate to kapt's generated stub-compile tasks (e.g. kaptGenerateStubs*UnitTestKotlin),
// which fall back to the Gradle daemon's own JDK and fail with a JVM-target mismatch.
kotlin {
    compilerOptions {
        jvmTarget.set(rootProject.ext.kotlinJvmTarget)
    }
}

dependencies {
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    kapt "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    testImplementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation "androidx.test:core-ktx:1.7.0"
    testImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    testImplementation 'com.google.truth:truth:1.4.5'
    testImplementation 'io.mockk:mockk:1.14.11'
    testImplementation 'org.json:json:20260814'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"

    implementation 'androidx.core:core-ktx:1.18.0' // newer versions require compileSdk 37
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation "androidx.compose.ui:ui:1.11.4" // newer versions require compileSdk 37

    implementation("com.fingerprint.android:sdk:4.1.0") {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
    }

    // okhttp lib added to keep consistency across the platforms (ReactNative, Native)
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

afterEvaluate {
    // remove the sources jar from the release version of the library
    tasks.matching { t ->
        t.name == 'androidLibReleaseSourcesJar'
                || t.name == 'generateAndroidLibReleaseSources'
                || t.name == 'reactNativeLibReleaseSourcesJar'
                || t.name == 'generateReactNativeLibReleaseSourcesJar'
    }.configureEach { t ->
        t.enabled = false
    }
    publishing {
        publications {
            // Creates a Maven publication called "release".
            androidLibRelease(MavenPublication) {
                // Applies the component for the release build variant.
                from components.androidLibRelease

                // You can then customize attributes of the publication as shown below.
                groupId = nameSpace
                artifactId = "$androidSDKVariant"
                version = versionName
            }
            // Creates a Maven publication called “debug”.
            androidLibDebug(MavenPublication) {
                // Applies the component for the debug build variant.
                from components.androidLibDebug

                groupId = nameSpace
                artifactId = "$androidSDKVariant$debugVariant"
                version = versionName
            }
            reactNativeLibRelease(MavenPublication) {
                // Applies the component for the release build variant.
                from components.reactNativeLibRelease

                // You can then customize attributes of the publication as shown below.
                groupId = nameSpace
                artifactId = "$reactNativeVariant-$androidSDKVariant"
                version = versionName
            }
            // Creates a Maven publication called “debug”.
            reactNativeLibDebug(MavenPublication) {
                // Applies the component for the debug build variant.
                from components.reactNativeLibDebug

                groupId = nameSpace
                artifactId = "$reactNativeVariant-$androidSDKVariant$debugVariant"
                version = versionName
            }
        }
    }
}

def exclusions = [
        "**/R.class",
        "**/R\$*.class",
        "**/BuildConfig.*",
        "**/Manifest*.*",
        "**/*Test*.*",
]

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testAndroidLibDebugUnitTest'
    reports {
        xml.required = true
        html.required = true
        xml.destination file("${buildDir}/reports/jacocoTestReport/jacoco.xml")
        html.destination file("${buildDir}/reports/jacocoTestReport/html")
    }

    classDirectories.setFrom(
            fileTree(dir: "${buildDir}/tmp/kotlin-classes/androidLibDebug", excludes: exclusions),
            fileTree(dir: "${buildDir}/tmp/kotlin-classes/androidLibDebugUnitTest", excludes: exclusions)
    )

    sourceDirectories.setFrom(
            files("${project.projectDir}/src/main/java", "${project.projectDir}/src/main/kotlin")
    )

    executionData.setFrom(
            fileTree(dir: "${buildDir}", include: ["outputs/unit_test_code_coverage/androidLibDebugUnitTest/testAndroidLibDebugUnitTest.exec"])
    )
}
