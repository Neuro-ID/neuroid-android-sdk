plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
    id 'org.sonarqube' version '6.3.1.5724'
    id 'org.jlleitschuh.gradle.ktlint'
}

ktlint {
    version.set("1.3.1")
    android.set(true)
    ignoreFailures.set(false)
    outputToConsole.set(true)
    filter {
        exclude { it.file.path.contains("${buildDir}${File.separator}") }
    }
}
def versionPropsFile = rootProject.file("version.properties")
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
}

sonar {
    properties {
        property("sonar.projectKey", "Neuro-ID_neuroid-android-sdk")
        property("sonar.host.url", "https://sonarcloud.io")
    }
}

def getGitHash = { ->
    def stdout = new ByteArrayOutputStream()
    exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
        standardOutput = stdout
    }
    return stdout.toString().trim()
}
def nameSpace = "us.ttyl.neuroid.tracker"

def androidSDKVariant = "neuroid-tracker-android-sdk"
def debugVariant = "-debug"
def reactNativeVariant = "react"

def pomUrl = "https://github.com/Neuro-ID/neuroid-android-sdk"

ext {
    versionName = "\"${versionProps['VERSION_MAJOR']}.${versionProps['VERSION_MINOR']}.${versionProps['VERSION_PATCH']}\""
}
// versionName above intentionally contains literal double quotes since it's also injected
// as a raw Java/Kotlin string literal via buildConfigField. Maven/project versions must NOT
// contain quote characters (Maven Central rejects them), so use a separate, clean value.
def mavenVersion = "${versionProps['VERSION_MAJOR']}.${versionProps['VERSION_MINOR']}.${versionProps['VERSION_PATCH']}"
group = nameSpace
version = mavenVersion

android {
    namespace = "us.ttyl.neuroid.tracker"
    compileSdkVersion = 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        multiDexEnabled true
        android.buildFeatures.buildConfig true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        versionName = "\"${versionProps['VERSION_MAJOR']}.${versionProps['VERSION_MINOR']}.${versionProps['VERSION_PATCH']}\""
    }

    buildTypes {
        debug {
            minifyEnabled false
            jniDebuggable true
            buildConfigField "String", "VERSION_NAME", "${defaultConfig.versionName}"
            buildConfigField "String", "GIT_HASH", "\"${getGitHash()}\""
            enableUnitTestCoverage = true    // For unit tests
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "VERSION_NAME", "${defaultConfig.versionName}"
            buildConfigField "String", "GIT_HASH", "\"${getGitHash()}\""
        }
    }

    flavorDimensions = ["native", "adv"]

    productFlavors {
        android {
            dimension "native"
        }
        reactNative {
            dimension "native"
        }
        lib {
            dimension "adv"
        }
    }

    libraryVariants.all { variant ->
        variant.outputs.all {
            def versionName = defaultConfig.versionName.replace('\"', '')
            outputFileName = "${variant.getFlavorName()}/neuro-id-android-sdk-${variant.getFlavorName()}-$versionName-${variant.buildType.name}.aar"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
    }
}

dependencies {
    testImplementation 'junit:junit:4.+'
    testImplementation 'androidx.test.ext:junit:1.1.3'
    testImplementation "androidx.test:core-ktx:1.4.0"
    testImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    testImplementation 'com.google.truth:truth:0.43'
    testImplementation 'io.mockk:mockk:1.12.0'
    testImplementation 'org.json:json:20140107'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.1"

    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.lifecycle:lifecycle-process:2.4.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.1'

    implementation "org.jetbrains.kotlin:kotlin-reflect:1.7.10"

    // compose stuff
    implementation "androidx.compose.ui:ui:1.7.3"

    reactNativeImplementation("com.facebook.react:react-android:0.76.9")

    implementation("com.fingerprint.android:pro:2.17.1") {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
    }

    // okhttp lib added to keep consistency across the platforms (ReactNative, Native)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.2'
}

// Maven Central requires a sources and a javadoc artifact for every published component.
// We intentionally do not ship real sources, so these jars are published empty just to
// satisfy Central's validation rules. Each publication needs its own distinct jar files
// (different archiveBaseName) -- reusing the same task/output across both the android and
// reactNative publications causes their independent signing tasks to write conflicting
// .asc files to the same path.
task emptyAndroidLibSourcesJar(type: Jar) {
    archiveBaseName.set(androidSDKVariant)
    archiveClassifier.set('sources')
}

task emptyAndroidLibJavadocJar(type: Jar) {
    archiveBaseName.set(androidSDKVariant)
    archiveClassifier.set('javadoc')
}

task emptyReactNativeLibSourcesJar(type: Jar) {
    archiveBaseName.set("$reactNativeVariant-$androidSDKVariant")
    archiveClassifier.set('sources')
}

task emptyReactNativeLibJavadocJar(type: Jar) {
    archiveBaseName.set("$reactNativeVariant-$androidSDKVariant")
    archiveClassifier.set('javadoc')
}

afterEvaluate {
    // remove the sources jar from the release version of the library
    tasks.matching { t ->
        t.name == 'androidLibReleaseSourcesJar'
                || t.name == 'generateAndroidLibReleaseSources'
                || t.name == 'reactNativeLibReleaseSourcesJar'
                || t.name == 'generateReactNativeLibReleaseSourcesJar'
    }.configureEach { t ->
        t.enabled = false
    }
    publishing {
        publications {
            // Creates a Maven publication called "release".
            androidLibRelease(MavenPublication) {
                // Applies the component for the release build variant.
                from components.androidLibRelease
                artifact emptyAndroidLibSourcesJar
                artifact emptyAndroidLibJavadocJar

                // You can then customize attributes of the publication as shown below.
                groupId = nameSpace
                artifactId = "$androidSDKVariant"
                version = mavenVersion

                pom {
                    name.set("NeuroID Android SDK")
                    description.set("NeuroID's Android Mobile SDK for embedding behavioral analytics inside mobile applications.")
                    url.set(pomUrl)
                    licenses {
                        license {
                            name.set("MIT License")
                            url.set("${pomUrl}/blob/master/LICENSE")
                        }
                    }
                    developers {
                        developer {
                            name.set("Neuro-ID")
                            organization.set("Neuro-ID, Inc.")
                            organizationUrl.set("https://neuroid.com")
                        }
                    }
                    scm {
                        connection.set("scm:git:git://github.com/Neuro-ID/neuroid-android-sdk.git")
                        developerConnection.set("scm:git:ssh://github.com/Neuro-ID/neuroid-android-sdk.git")
                        url.set(pomUrl)
                    }
                }
            }
            // Creates a Maven publication called “debug”.
            androidLibDebug(MavenPublication) {
                // Applies the component for the debug build variant.
                from components.androidLibDebug

                groupId = nameSpace
                artifactId = "$androidSDKVariant$debugVariant"
                version = mavenVersion
            }
            reactNativeLibRelease(MavenPublication) {
                // Applies the component for the release build variant.
                from components.reactNativeLibRelease
                artifact emptyReactNativeLibSourcesJar
                artifact emptyReactNativeLibJavadocJar

                // You can then customize attributes of the publication as shown below.
                groupId = nameSpace
                artifactId = "$reactNativeVariant-$androidSDKVariant"
                version = mavenVersion

                pom {
                    name.set("NeuroID Android SDK (React Native)")
                    description.set("NeuroID's Android Mobile SDK for embedding behavioral analytics inside React Native applications.")
                    url.set(pomUrl)
                    licenses {
                        license {
                            name.set("MIT License")
                            url.set("${pomUrl}/blob/master/LICENSE")
                        }
                    }
                    developers {
                        developer {
                            name.set("Neuro-ID")
                            organization.set("Neuro-ID, Inc.")
                            organizationUrl.set("https://neuroid.com")
                        }
                    }
                    scm {
                        connection.set("scm:git:git://github.com/Neuro-ID/neuroid-android-sdk.git")
                        developerConnection.set("scm:git:ssh://github.com/Neuro-ID/neuroid-android-sdk.git")
                        url.set(pomUrl)
                    }
                }
            }
            // Creates a Maven publication called “debug”.
            reactNativeLibDebug(MavenPublication) {
                // Applies the component for the debug build variant.
                from components.reactNativeLibDebug

                groupId = nameSpace
                artifactId = "$reactNativeVariant-$androidSDKVariant$debugVariant"
                version = mavenVersion
            }
        }
    }

    // Only the release publications are meant for Maven Central; debug builds should
    // never leave mavenLocal/JitPack.
    tasks.matching { t ->
        t.name == "publishAndroidLibDebugPublicationToSonatypeRepository"
                || t.name == "publishReactNativeLibDebugPublicationToSonatypeRepository"
    }.configureEach { t ->
        t.enabled = false
    }

    // GPG signing for Maven Central. Secrets are supplied later via gradle.properties
    // (signingInMemoryKey / signingInMemoryKeyPassword) or SIGNING_KEY / SIGNING_PASSWORD
    // env vars, ASCII-armored in-memory key. Signing is skipped when absent so local/JitPack
    // publishing keeps working without secrets.
    def signingKey = findProperty("signingInMemoryKey") ?: System.getenv("SIGNING_KEY")
    def signingPassword = findProperty("signingInMemoryKeyPassword") ?: System.getenv("SIGNING_PASSWORD")
    if (signingKey && signingPassword) {
        signing {
            useInMemoryPgpKeys(signingKey, signingPassword)
            sign publishing.publications.androidLibRelease
            sign publishing.publications.reactNativeLibRelease
        }
    }
}

def exclusions = [
        "**/R.class",
        "**/R\$*.class",
        "**/BuildConfig.*",
        "**/Manifest*.*",
        "**/*Test*.*",
]

task jacocoTestReport(type: JacocoReport, dependsOn: ['testAndroidLibDebugUnitTest']) {
    reports {
        xml.required = true
        html.required = true
        xml.destination file("${buildDir}/reports/jacocoTestReport/jacoco.xml")
        html.destination file("${buildDir}/reports/jacocoTestReport/html")
    }

    classDirectories.setFrom(
            fileTree(dir: "${buildDir}/tmp/kotlin-classes/androidLibDebug", excludes: exclusions),
            fileTree(dir: "${buildDir}/tmp/kotlin-classes/androidLibDebugUnitTest", excludes: exclusions)
    )

    sourceDirectories.setFrom(
            files("${project.projectDir}/src/main/java", "${project.projectDir}/src/main/kotlin")
    )

    executionData.setFrom(
            fileTree(dir: "${buildDir}", include: ["outputs/unit_test_code_coverage/androidLibDebugUnitTest/testAndroidLibDebugUnitTest.exec"])
    )
}

