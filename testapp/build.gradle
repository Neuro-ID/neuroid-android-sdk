plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // https://developer.android.com/develop/ui/compose/setup-compose-dependencies-and-compiler
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'com.neuroid.example'
    compileSdkVersion = 36

    buildFeatures {
        viewBinding true
        compose true
    }

    defaultConfig {
        applicationId "com.neuroid.example"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "com.neuroid.example.NIDTestInstrumentationRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // use debug signing config for release builds to avoid having to
            // create a separate keystore for testing purposes
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility rootProject.ext.javaVersionCompat
        targetCompatibility rootProject.ext.javaVersionCompat
    }

    flavorDimensions = ["native", "adv"]

    productFlavors {
        android {
            dimension "native"
        }
        reactNative {
            dimension "native"
        }

        lib {
            dimension "adv"
        }
    }
}

kotlin {
    jvmToolchain(rootProject.ext.jdkVersion)
    compilerOptions {
        jvmTarget.set(rootProject.ext.kotlinJvmTarget)
    }
}

dependencies {
    implementation project(':NeuroID')
    implementation 'androidx.core:core-ktx:1.18.0' // newer versions require compileSdk 37
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.material:material:1.14.0'

    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.runtime:runtime"
    implementation 'androidx.compose.material:material'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation "androidx.test:core-ktx:1.7.0"
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    androidTestImplementation 'com.google.code.gson:gson:2.14.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'io.mockk:mockk-android:1.14.11'
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.11.4'
    debugImplementation "androidx.compose.ui:ui-test-manifest:1.11.4"

    // only for testing purposes, regular apps do not need this dependency, it is already included in the SDK
    androidTestImplementation("com.fingerprint.android:sdk:4.1.0") {
        exclude group: "com.google.android.gms"
    }
}